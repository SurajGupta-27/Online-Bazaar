# Render Blueprint: the Express API as one free web service. The React
# frontend is deployed separately on Vercel (client/vercel.json) and calls this
# API cross-origin (REACT_APP_API_URL on Vercel, CLIENT_URL here for CORS).
# In Render: New > Blueprint > pick this repository. Values marked
# `sync: false` are secrets Render asks you for; they never live in git.
#
# Prefer one service for both? Use `npm ci && npm run build` as the build
# command, drop SERVE_CLIENT, and add REACT_APP_GOOGLE_CLIENT_ID here: Express
# then serves the React build on the API's own URL.
services:
  - type: web
    name: online-bazaar-api
    runtime: node
    plan: free
    branch: main
    # NODE_ENV=production makes npm ci skip devDependencies (test tools).
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DEV_MODE
        value: production
      # API only: the store is on Vercel.
      - key: SERVE_CLIENT
        value: "false"
      # Proxy hops in front of the app; check with GET /api/health (see README).
      - key: TRUST_PROXY
        value: "1"
      # Your Vercel URL(s), comma-separated, no trailing slash, e.g.
      # https://online-bazaar.vercel.app. Allowed by CORS; the first is used
      # for links in emails. Required for the store to reach the API.
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Email: Render's free plan blocks SMTP, so use Brevo's API.
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Brevo's free plan sends 300 a day: leave room for order emails.
      - key: ALERT_DAILY_LIMIT
        value: "150"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Google Sign-In: the same OAuth client ID as REACT_APP_GOOGLE_CLIENT_ID
      # on Vercel.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
